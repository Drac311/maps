<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FunRide - Rutas Divertidas</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="map"></div>
    
    <div class="overlay-ui">
        <div class="search-bar">
            <input type="text" id="destination" placeholder="¿A dónde vamos?" />
            <button id="search-btn">🔍</button>
        </div>
        
        <div id="route-card" class="card hidden">
            <div class="card-header">
                <span id="fun-emoji">🏍️</span>
                <span id="fun-rating">Calculando...</span>
                <span id="points" class="points">0 pts</span>
            </div>
            <div class="card-details">
                <span id="distance">0.0 km</span>
                <span id="time">0 min</span>
                <span id="route-count">0 rutas</span>
            </div>
        </div>
        
        <div id="loading" class="card hidden">⏳ Buscando la ruta más divertida...</div>
        <div id="error" class="card error hidden"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
