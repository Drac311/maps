<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0e1a">
  <title>FunRide 🏍️ — Rutas divertidas</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="results" class="screen">
    <div id="map" class="visible"></div>

    <div class="top-bar">
      <button id="back-btn" class="icon-btn hidden" title="Volver" aria-label="Volver">←</button>
      <div class="mini-search">
        <span class="ms-icon">🔍</span>
        <input id="destination" type="search" autocomplete="off" enterkeyhint="search" aria-label="Buscar lugar" placeholder="Busca un lugar, restaurante o calle">
        <button id="clear-btn" class="clear-btn hidden" aria-label="Borrar">✕</button>
        <div id="ac-box" class="ac-box hidden"></div>
      </div>
      <button id="menu-btn" class="icon-btn" title="Menú" aria-label="Menú">☰</button>
    </div>

    <div class="fabs">
      <button id="locate-btn" class="icon-btn" title="Mi ubicación" aria-label="Mi ubicación">📍</button>
      <button id="recenter-btn" class="icon-btn hidden" title="Recentrar ruta" aria-label="Recentrar ruta">🎯</button>
    </div>

    <div id="map-hint" class="map-hint">👆 Toca el mapa para elegir un destino</div>

    <div id="place-card" class="place-card hidden">
      <button id="place-close" class="clear-btn place-close" aria-label="Cerrar">✕</button>
      <div class="place-info">
        <div class="place-name" id="place-name"></div>
        <div class="place-addr" id="place-addr"></div>
      </div>
      <div class="place-dist" id="place-dist"></div>
      <button id="fav-btn" class="action-btn">⭐ Guardar lugar</button>
      <button id="route-btn" class="action-btn primary">🏍️ Ver rutas</button>
    </div>

    <div id="drawer" class="drawer hidden">
      <div class="drawer-head">
        <div class="tabs">
          <button class="tab active" data-tab="saved">⭐ Guardados</button>
          <button class="tab" data-tab="comm">🌍 Comunidad</button>
          <button class="tab" data-tab="friends">👥 Amigos</button>
          <button class="tab" data-tab="account">👤 Cuenta</button>
        </div>
        <button id="drawer-close" class="clear-btn" aria-label="Cerrar">✕</button>
      </div>
      <div id="drawer-body" class="drawer-body"></div>
    </div>

    <div class="bottom-panel hidden" id="route-panel">
      <div class="mode-toggle" data-mode="fast">
        <button class="mode-btn active" data-mode="fast"><span>⚡</span> Más rápida</button>
        <button class="mode-btn" data-mode="fun"><span>🏍️</span> Más divertida</button>
        <div class="mode-indicator"></div>
      </div>
      <div class="route-stats" id="route-stats"></div>
      <div class="compare-bar" id="compare-bar"></div>
      <div class="fun-meter-wrap">
        <div class="fun-meter-label"><span>Nivel de diversión</span><span id="fun-percent">0%</span></div>
        <div class="fun-meter"><div class="fun-meter-fill" id="fun-meter-fill"></div></div>
      </div>
      <button class="action-btn full" id="save-route-btn">💾 Guardar ruta</button>
      <div class="actions">
        <button class="action-btn" id="share-btn">📤 Compartir</button>
        <button class="action-btn primary" id="go-btn">▶ Iniciar ruta</button>
      </div>
    </div>
  </div>

  <div class="loading-overlay hidden" id="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loading-text">Calculando la ruta más divertida...</div>
  </div>
  <div class="toast hidden" id="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="online.js"></script>
</body>
</html>
